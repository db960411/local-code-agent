[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-code-agent"
version = "0.1.0"
description = "Local coding agent powered by Ollama"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.31",
    "rich>=13.7"
]

[project.scripts]
lca = "agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]